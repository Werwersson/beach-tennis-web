services:
  - type: web
    name: beach-tennis-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask --app wsgi db upgrade && python -m flask --app wsgi seed && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: professor@beachtennis.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "0"
