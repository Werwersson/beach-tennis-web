{% extends 'base_admin.html' %}
{% block title %}BT Tracker — Comparar Partidas{% endblock %}
{% block page_title %}Comparar Partidas{% endblock %}

{% block content %}
<div class="card-bt mb-4">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-3">
      <i class="bi bi-arrow-left-right me-2 text-primary"></i>Selecione duas partidas para comparação
    </h5>
    <form method="POST" action="{{ url_for('admin.partidas_comparar') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label fw-bold">Partida 1</label>
          <select name="partida1" class="form-select" required>
            <option value="">— Selecione —</option>
            {% for p in partidas %}
            <option value="{{ p.id }}">
              #{{ p.id }} — {{ p.dupla1_label }} vs {{ p.dupla2_label }}
              ({{ p.data.strftime('%d/%m/%Y') }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-5">
          <label class="form-label fw-bold">Partida 2</label>
          <select name="partida2" class="form-select" required>
            <option value="">— Selecione —</option>
            {% for p in partidas %}
            <option value="{{ p.id }}">
              #{{ p.id }} — {{ p.dupla1_label }} vs {{ p.dupla2_label }}
              ({{ p.data.strftime('%d/%m/%Y') }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary fw-bold w-100">
            <i class="bi bi-bar-chart-fill me-1"></i> Comparar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<a href="{{ url_for('admin.partidas_lista') }}" class="btn btn-outline-secondary">
  <i class="bi bi-arrow-left me-1"></i> Voltar à lista
</a>
{% endblock %}
